plugins {
    // AGP 9 以降は Kotlin が組み込み（built-in Kotlin）になったため、
    // org.jetbrains.kotlin.android プラグインは適用しない（適用するとビルドが失敗する）。
    id 'com.android.application' version '9.3.1' apply false
    // Compose コンパイラは Kotlin 2.0 以降 Kotlin 本体に同梱され、専用プラグインの適用が必須。
    // バージョンは built-in Kotlin のコンパイラ（AGP 9.3.1 同梱）に合わせる。
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10' apply false
    id 'org.jlleitschuh.gradle.ktlint' version '14.2.0' apply false
}
